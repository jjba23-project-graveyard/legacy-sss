font=Intel One Mono:size=10
dpi-aware=yes
pad=12x12


[bell]
urgent=no
notify=no
visual=no


[scrollback]
lines=100000

[colors]
alpha=0.9
background=111111
foreground=cfdfd5


[key-bindings]
scrollback-up-page=Mod1+v
scrollback-down-page=Control+v
scrollback-home=Mod1+less
scrollback-end=Mod1+greater
clipboard-copy=Mod1+w
clipboard-paste=Control+y
